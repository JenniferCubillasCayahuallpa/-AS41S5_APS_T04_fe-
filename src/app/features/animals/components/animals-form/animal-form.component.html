<div class="form-container">
  <div class="form-header">
    <h3>Nuevo Registro de Animal</h3>
    <p>Complete la información básica del ejemplar según su arete oficial.</p>
  </div>

  <form class="animal-form">
    <div class="form-grid">
      <div class="form-group">
        <label for="codigo_arete">Código de Arete</label>
        <input type="text" id="codigo_arete" name="codigo_arete" placeholder="Ej: VACA-001" required>
      </div>

      <div class="form-group">
        <label for="fecha_nacimiento">Fecha de Nacimiento</label>
        <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" required>
      </div>

      <div class="form-group">
        <label for="id_especie">Especie</label>
        <select id="id_especie" name="id_especie" required>
          <option value="">Seleccione especie</option>
          <option value="1">Bovino</option>
          <option value="2">Porcino</option>
          <option value="3">Caprino</option>
        </select>
      </div>

      <div class="form-group">
        <label for="id_raza">Raza</label>
        <select id="id_raza" name="id_raza" required>
          <option value="">Seleccione raza</option>
          <option value="1">Holstein</option>
          <option value="2">Angus</option>
          <option value="3">Brahman</option>
        </select>
      </div>

      <div class="form-group">
        <label for="id_proposito">Propósito</label>
        <select id="id_proposito" name="id_proposito" required>
          <option value="">Seleccione propósito</option>
          <option value="1">Leche</option>
          <option value="2">Carne</option>
          <option value="3">Mixto</option>
        </select>
      </div>

      <div class="form-group">
        <label>Sexo</label>
        <div class="radio-group">
          <label>
            <input type="radio" name="sexo" value="M" required> Macho
          </label>
          <label>
            <input type="radio" name="sexo" value="H" required> Hembra
          </label>
        </div>
      </div>
    </div>

    <div class="form-actions">
      <button type="button" class="btn-cancel" routerLink="/animals">Cancelar</button>
      <button type="submit" class="btn-save">Guardar</button>
    </div>
  </form>
</div>
